name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uv run jobradar validate-config
