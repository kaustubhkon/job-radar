[project]
name = "job-radar"
version = "0.1.0"
description = "A daily internship digest you fork and own."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "premailer>=3.10",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
# Tier 2 job-board scraping. Pinned to a commit because the PyPI release lags main.
jobspy = ["python-jobspy @ git+https://github.com/speedyapply/JobSpy@fda080a373e8226f3fd60635323f5da9af9892b1"]
gmail = [
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
]
llm = ["anthropic>=0.40"]
all = ["job-radar[jobspy,gmail,llm]"]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
